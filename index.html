<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PDF</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .container {
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      flex: 1;
    }

    h1 {
      color: #ffffff;
      font-size: 32px;
      margin-bottom: 30px;
    }

    .download-btn {
      padding: 15px 35px;
      background: #ffffff10;
      border: 2px solid #00ffe5;
      border-radius: 50px;
      color: #00ffe5;
      font-size: 20px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.4s ease;
      touch-action: manipulation;
      backdrop-filter: blur(5px);
    }

    .download-btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 300%;
      height: 300%;
      background: rgba(0, 255, 229, 0.1);
      transition: all 0.6s ease;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      z-index: 0;
    }

    .download-btn:hover::before,
    .download-btn:active::before {
      transform: translate(-50%, -50%) scale(1);
    }

    .download-btn:hover,
    .download-btn:focus,
    .download-btn:active {
      background: #00ffe5;
      color: #000;
      box-shadow: 0 0 25px #00ffe5, 0 0 40px #00ffe580;
      transform: scale(1.05);
    }

    .download-btn span {
      position: relative;
      z-index: 1;
    }

    footer {
      width: 100%;
      background-color: #0a1a1f;
      color: #b9f6ff;
      text-align: center;
      padding: 15px 10px;
      font-size: 14px;
      border-top: 1px solid #00ffe5;
      position: fixed;
      bottom: 0;
      left: 0;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 26px;
      }

      .download-btn {
        font-size: 18px;
        padding: 12px 28px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Download Your PDF</h1>
    <a href="hadid.pdf" download class="download-btn">
      <span>Download📄</span>
    </a>
  </div>

  <footer>
    © All rights reserved to Ahnaf Tahsin....
  </footer>
</body>
</html>
